x-app: &app
  image: newlora-api:local
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
  env_file: .env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes: [artifacts:/data/artifacts]
  networks: [backend, outbound, browser]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  api:
    <<: *app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [python, -m, newlora.jobs, worker]
    healthcheck:
      test: [CMD, python, -c, "import redis,os; assert redis.from_url(os.environ['REDIS_URL']).get('health:worker')"]
      interval: 30s
      timeout: 5s
      retries: 3
  notifier:
    <<: *app
    command: [python, -m, newlora.jobs, notifier]
    healthcheck:
      test: [CMD, python, -c, "import redis,os; assert redis.from_url(os.environ['REDIS_URL']).get('health:notifier')"]
      interval: 30s
      timeout: 5s
      retries: 3
  voice:
    <<: *app
    command: [python, -m, newlora.voice]
    healthcheck:
      test: [CMD, python, -c, "import redis,os; assert redis.from_url(os.environ['REDIS_URL']).get('health:voice')"]
      interval: 30s
      timeout: 5s
      retries: 3
  scheduler:
    <<: *app
    command: [python, -m, newlora.jobs, scheduler]
    healthcheck:
      test: [CMD, python, -c, "import redis,os; assert redis.from_url(os.environ['REDIS_URL']).get('health:scheduler')"]
      interval: 30s
      timeout: 5s
      retries: 3
  migrate:
    <<: *app
    profiles: [maintenance]
    restart: 'no'
    command: [alembic, upgrade, head]
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: newlora
      POSTGRES_USER: newlora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres:/var/lib/postgresql/data]
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U newlora]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 3
  browser:
    build:
      context: .
      dockerfile: infra/docker/browser.Dockerfile
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:?required}
      EGRESS_PROXY: http://egress:8091
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    shm_size: 512mb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, "seccomp=./infra/docker/chromium-seccomp.json"]
    networks: [browser]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  egress:
    image: newlora-api:local
    command: [python, /app/services/browser/proxy.py]
    networks: [browser, outbound]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
  search:
    image: searxng/searxng:latest
    volumes: [./infra/docker/searxng.yml:/etc/searxng/settings.yml:ro]
    restart: unless-stopped
    networks: [backend, outbound]
  edge:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    environment: {DOMAIN: '${DOMAIN:?required}'}
    volumes: [./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data, caddy_config:/config]
    networks: [backend, outbound]
    restart: unless-stopped
    depends_on: [api]
networks:
  backend: {internal: true}
  browser: {internal: true}
  outbound: {}
volumes:
  postgres: {}
  redis: {}
  artifacts: {}
  caddy: {}
  caddy_config: {}
