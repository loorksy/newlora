[project]
name = "newlora"
version = "0.1.0"
description = "Independent persistent AI trading research agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.15,<2",
  "redis>=5,<7", "cryptography>=44", "PyJWT>=2.10,<3", "argon2-cffi>=23",
  "httpx>=0.28,<1", "openai==3.24.0", "anthropic==1.11.0", "zai-sdk==0.2.3",
  "structlog>=25", "firebase-admin>=6.6,<8", "beautifulsoup4>=4.13,<5",
  "playwright>=1.51,<2", "python-multipart>=0.0.20", "pillow>=11"
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "aiosqlite>=0.21", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "respx>=0.22"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["services/api/newlora"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/backend"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["services/api/newlora"]
